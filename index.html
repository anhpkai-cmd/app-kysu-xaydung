<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f3ee">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Sổ tay kỹ sư</title>
<style>
  /* Hallmark · audit pass · một màu nhấn (cam an toàn), nền/mực pha cùng tông, không #000/#fff */
  :root{
    --paper:oklch(97% .01 75); --card:oklch(99% .006 75); --ink:oklch(22% .012 75);
    --mute:oklch(48% .012 75); --rule:oklch(88% .012 75); --accent:oklch(55% .17 45); --on-accent:oklch(98% .01 75);
    --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --gap:16px;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:oklch(16% .01 75); --card:oklch(21% .012 75); --ink:oklch(94% .008 75);
    --mute:oklch(72% .012 75); --rule:oklch(32% .012 75); --accent:oklch(72% .16 50); --on-accent:oklch(16% .01 75);
  }}
  html,body{overflow-x:clip}
  body{font:16px/1.5 var(--font);margin:0;background:var(--paper);color:var(--ink)}
  header{display:flex;gap:var(--gap);align-items:center;justify-content:space-between;padding:12px var(--gap);border-bottom:1px solid var(--rule)}
  h1{font-size:20px;font-weight:700;margin:0}
  h2{font-size:18px;margin:24px 0 4px}
  h3{font-size:14px;color:var(--mute);margin:16px 0 4px}
  main{padding:var(--gap);max-width:720px;margin:auto}
  label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
  button,select,input{font:inherit;color:inherit;min-height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--rule);background:var(--card);box-sizing:border-box}
  select,input{width:100%}
  button{background:var(--accent);color:var(--on-accent);border:0;font-weight:600;cursor:pointer;white-space:nowrap}
  button:active{filter:brightness(.92)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .doc{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:12px var(--gap);margin:8px 0;display:flex;gap:var(--gap);align-items:center;justify-content:space-between}
  .doc>div{min-width:0;overflow-wrap:anywhere}
  .doc b{display:block;font-size:14px;color:var(--mute);font-weight:600}
  .doc small{color:var(--mute)}
  .nut{display:grid;gap:8px}
  #nhan button{display:block;margin-top:8px;max-width:100%;height:auto;min-height:44px;padding:8px 12px;white-space:normal;text-align:left;overflow-wrap:anywhere}
  .phu{background:transparent;color:var(--ink);border:1px solid var(--rule)}
  #nhan,#msg{color:var(--ink);background:var(--card);border-left:3px solid var(--accent);padding:8px 12px;margin:0 0 var(--gap)}
  .nutlk{display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--rule);background:var(--card);color:var(--ink);text-decoration:none;font-weight:600}
  .anh{align-items:flex-start}
  .anh label{margin:0;display:flex;gap:8px;align-items:flex-start;color:inherit}
  .anh input[type=checkbox]{width:28px;min-height:28px;margin:0}
  .anh img{width:88px;height:88px;object-fit:cover;border-radius:6px;background:var(--rule)}
  .anh th,.anh>div{min-width:0}
  #ttms:empty,#nkmsg:empty,#anms:empty,#sotms:empty,#tqms:empty{display:none}
  #tqd .cb{font-weight:600;color:var(--accent)}
  #sotds{display:grid;gap:8px}
  summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600}
  #msg:empty,#nhan:empty{display:none}
  @media (prefers-reduced-motion:no-preference){button{transition:filter .15s}}
</style>
</head>
<body>
<header><h1>Sổ tay kỹ sư</h1><button id="vao">Đăng nhập Google</button></header>
<main>
  <p id="nhan" role="status" hidden></p>
  <p id="msg" role="status">Bấm “Đăng nhập Google” để xem sổ đăng ký công trình.</p>
  <div id="cts" hidden><label for="ct">Công trình đang làm</label><select id="ct"></select></div>
  <section id="sot" hidden>
    <h2>Hôm nay còn sót gì</h2>
    <div id="sotds"></div>
    <p id="sotms" role="status"></p>
    <p><button id="sotb" class="phu">Nhắc tôi lúc 17h mỗi ngày</button></p>
  </section>
  <section id="tq" hidden>
    <h2>Thời tiết công trình</h2>
    <div id="tqd"></div>
    <p id="tqms" role="status"></p>
    <details><summary>Vị trí công trình</summary>
    <label for="tqv">Tọa độ (vĩ độ, kinh độ)</label><input id="tqv" inputmode="decimal" placeholder="10.77, 106.70">
    <p><button id="tql" class="phu">Lưu vị trí</button> <button id="tqg" class="phu">Lấy vị trí máy</button></p>
    </details>
  </section>
  <section id="viec" hidden>
    <h2>Việc cần làm</h2>
    <div id="dsv"></div>
    <div id="han"></div>
    <label for="vten">Việc mới</label><input id="vten" placeholder="ví dụ: Gia hạn bảo lãnh thực hiện hợp đồng">
    <label for="vct">Công trình</label><select id="vct"></select>
    <label for="vhan">Hạn (có hạn thì điện thoại sẽ nhắc qua Google Lịch)</label><input id="vhan" type="date">
    <p><button id="vthem">Thêm việc</button></p>
  </section>
  <div id="loc" hidden>
    <h2>Tài liệu</h2>
    <label for="q">Tìm tài liệu</label><input id="q" type="search" placeholder="ví dụ: móng, cọc, KC-005">
  </div>
  <div id="ds"></div>
  <section id="tt" hidden>
    <h2>Thông tin công trình</h2>
    <p id="ttms" role="status"></p>
    <div id="ttds"></div>
    <details><summary>+ Thêm liên hệ hoặc thông tin</summary>
    <label for="ttnh">Loại</label><select id="ttnh"><option>Liên hệ</option><option>Thông tin</option></select>
    <label for="ttten">Tên (người liên hệ, hoặc tên mục như Địa chỉ)</label><input id="ttten">
    <label for="ttct2">Chi tiết (vai trò, đơn vị, nội dung)</label><input id="ttct2" placeholder="ví dụ: Giám sát, Cty ABC">
    <label for="ttdt">Điện thoại (nếu có)</label><input id="ttdt" type="tel" inputmode="tel">
    <p><button id="ttt">Thêm</button></p>
    </details>
  </section>
  <section id="anh" hidden>
    <h2>Ảnh hiện trường</h2>
    <p id="anms" role="status"></p>
    <div id="anx" hidden>
      <p><button id="anc" class="phu">Chọn tất cả / Bỏ chọn</button></p>
      <div id="anl"></div>
      <label for="anhm">Hạng mục của các ảnh đã tick</label><select id="anhm"></select>
      <label for="anmt">Mô tả chung (không bắt buộc)</label><input id="anmt" placeholder="ví dụ: phá dỡ nền bệ trục A-C">
      <p id="anor" role="status"></p>
      <p><button id="and" class="phu" hidden>Dùng ngày đoán cho các ảnh đã tick</button></p>
      <p><button id="anb">Xếp ảnh đã tick</button></p>
    </div>
  </section>
  <section id="nk" hidden>
    <h2>Nhật ký ngày</h2>
    <p id="nkmsg" role="status"></p>
    <div id="nkf" hidden>
      <label for="nkd">Ngày</label><input id="nkd" type="date">
      <div id="nkc"></div>
      <h3>Việc làm trong ngày</h3>
      <div id="nkds"></div>
      <label for="nkv">Công việc</label><select id="nkv"></select>
      <label for="nkk">Khối lượng</label><input id="nkk" type="number" min="0" step="any" inputmode="decimal">
      <p><button id="nkt" class="phu">Thêm việc vào ngày</button></p>
      <p><button id="nkl">Lưu nhật ký</button></p>
    </div>
  </section>
</main>
<input id="chon" type="file" hidden>
<script type="module" src="app.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
</body>
</html>
